<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AX/DX 응답 관리자</title><link rel="icon" type="image/png" href="favicon.png"><link rel="stylesheet" href="styles.css">
  <style>
    .admin{padding:42px 0}.admin-head,.admin-actions{display:flex;justify-content:space-between;gap:16px;align-items:center}.admin-actions{justify-content:flex-end}.admin-tabs{display:inline-flex;gap:8px;margin-top:22px;padding:6px;border:1px solid var(--line);border-radius:16px;background:#fff}.admin-tab{border:0;border-radius:11px;padding:12px 20px;background:transparent;color:var(--muted);font-weight:800}.admin-tab.active{color:#fff;background:linear-gradient(120deg,var(--blue),var(--violet))}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:22px 0}.stat{padding:22px}.stat strong{display:block;font-size:32px;color:var(--blue)}.table-wrap{overflow:auto;margin-top:18px}.data{width:100%;border-collapse:collapse;min-width:1040px}.data th,.data td{text-align:left;padding:14px;border-bottom:1px solid var(--line);font-size:14px}.data th{background:var(--soft)}.data input{width:18px;height:18px;accent-color:var(--blue)}.danger{color:#c52f48!important;border-color:#f1bdc6!important}.admin-note{margin-top:18px}.empty{text-align:center!important;padding:44px!important;color:var(--muted)}.delete-modal[hidden]{display:none}.delete-modal{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:20px;background:rgba(9,25,55,.36);backdrop-filter:blur(5px)}.delete-box{width:min(440px,100%);padding:30px}.delete-box h2{margin:0 0 12px}.delete-box p{color:var(--muted);line-height:1.6}.delete-box .admin-actions{margin-top:24px}.delete-box .admin-actions .btn{flex:1}.delete-error{color:#c52f48!important;font-weight:700}
    .admin[hidden]{display:none}.auth-gate{min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 80% 10%,#dfe7ff,transparent 38%),linear-gradient(145deg,#f8fbff,#f3efff)}.auth-gate[hidden]{display:none}.auth-card{width:min(430px,100%);padding:38px;text-align:center}.auth-card .logo{width:230px;margin-bottom:24px}.auth-card h1{margin:0 0 10px}.auth-card p{color:var(--muted);line-height:1.6}.auth-card form{display:grid;gap:12px;margin-top:24px}.auth-card input{width:100%;padding:17px 18px;border:1px solid #cedcf0;border-radius:14px;outline:none}.auth-card input:focus{border-color:var(--blue);box-shadow:0 0 0 4px #e8f1ff}.auth-error{min-height:20px;margin:0!important;color:#c52f48!important;font-size:14px;font-weight:700}
    @media(max-width:700px){.admin-head{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr}.admin-actions{width:100%;display:grid;grid-template-columns:1fr 1fr}.admin-actions .btn{padding:14px 10px;font-size:14px}}
  </style>
</head>
<body><section id="auth-gate" class="auth-gate"><div class="panel auth-card"><img class="logo" src="assets/douzone-logo.png" alt="DOUZONE Business Partner 아이원소프트뱅크"><h1>관리자 인증</h1><p>진단 응답을 확인하려면 관리자 비밀번호를 입력해주세요.</p><form id="auth-form"><input id="admin-password" type="password" autocomplete="current-password" placeholder="비밀번호" required aria-label="관리자 비밀번호"><button class="btn btn-primary btn-wide" type="submit">응답 관리자 들어가기</button><p id="auth-error" class="auth-error" aria-live="polite"></p></form></div></section><main id="admin-content" class="admin" hidden><div class="wrap">
  <div class="admin-head"><div><a href="index.html">← 진단 화면</a><h1>진단 응답 관리자</h1><p>고객 정보와 진단 응답을 선택·관리하고 엑셀로 내려받습니다.</p></div><div class="admin-actions"><button id="delete" class="btn btn-secondary danger" disabled>선택 삭제</button><button id="csv" class="btn btn-primary">엑셀로 다운로드</button></div></div>
  <div class="admin-tabs" role="tablist" aria-label="응답 유형"><button class="admin-tab active" data-tab="company" role="tab" aria-selected="true">기업 진단</button><button class="admin-tab" data-tab="personal" role="tab" aria-selected="false">개인 역량</button></div>
  <div class="stats"><div class="panel stat"><span id="count-label">기업 응답</span><strong id="count">0</strong></div><div class="panel stat"><span>평균 점수</span><strong id="avg">0</strong></div><div class="panel stat"><span>최근 응답</span><strong id="recent">-</strong></div></div>
  <section class="panel table-wrap"><table class="data"><thead id="table-head"></thead><tbody id="rows"></tbody></table></section>
  <p class="privacy admin-note">기업 진단과 개인 역량 응답은 별도 데이터로 관리됩니다. 운영 DB 연결 전에는 이 브라우저에 저장된 테스트 응답을 표시합니다.</p>
</div></main>
<div id="delete-modal" class="delete-modal" hidden role="dialog" aria-modal="true" aria-labelledby="delete-title"><div class="panel delete-box"><h2 id="delete-title">선택한 응답을 삭제할까요?</h2><p id="delete-message"></p><p id="delete-error" class="delete-error" hidden></p><div class="admin-actions"><button id="delete-cancel" class="btn btn-secondary">취소</button><button id="delete-confirm" class="btn btn-primary">삭제하기</button></div></div></div>
<script src="config.js"></script><script src="admin.js"></script></body></html>

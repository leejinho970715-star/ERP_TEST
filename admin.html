<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AX/DX 응답 관리자</title><link rel="icon" type="image/png" href="favicon.png"><link rel="stylesheet" href="styles.css">
  <style>
    .admin{padding:42px 0}.admin-head,.admin-actions{display:flex;justify-content:space-between;gap:16px;align-items:center}.admin-actions{justify-content:flex-end}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:22px 0}.stat{padding:22px}.stat strong{display:block;font-size:32px;color:var(--blue)}.table-wrap{overflow:auto;margin-top:18px}.data{width:100%;border-collapse:collapse;min-width:1040px}.data th,.data td{text-align:left;padding:14px;border-bottom:1px solid var(--line);font-size:14px}.data th{background:var(--soft)}.data input{width:18px;height:18px;accent-color:var(--blue)}.danger{color:#c52f48!important;border-color:#f1bdc6!important}.admin-note{margin-top:18px}.empty{text-align:center!important;padding:44px!important;color:var(--muted)}.delete-modal[hidden]{display:none}.delete-modal{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;padding:20px;background:rgba(9,25,55,.36);backdrop-filter:blur(5px)}.delete-box{width:min(440px,100%);padding:30px}.delete-box h2{margin:0 0 12px}.delete-box p{color:var(--muted);line-height:1.6}.delete-box .admin-actions{margin-top:24px}.delete-box .admin-actions .btn{flex:1}.delete-error{color:#c52f48!important;font-weight:700}
    @media(max-width:700px){.admin-head{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr}.admin-actions{width:100%;display:grid;grid-template-columns:1fr 1fr}.admin-actions .btn{padding:14px 10px;font-size:14px}}
  </style>
</head>
<body><main class="admin"><div class="wrap">
  <div class="admin-head"><div><a href="index.html">← 진단 화면</a><h1>진단 응답 관리자</h1><p>고객 정보와 진단 응답을 선택·관리하고 엑셀로 내려받습니다.</p></div><div class="admin-actions"><button id="delete" class="btn btn-secondary danger" disabled>선택 삭제</button><button id="csv" class="btn btn-primary">엑셀로 다운로드</button></div></div>
  <div class="stats"><div class="panel stat"><span>전체 응답</span><strong id="count">0</strong></div><div class="panel stat"><span>평균 점수</span><strong id="avg">0</strong></div><div class="panel stat"><span>최근 응답</span><strong id="recent">-</strong></div></div>
  <section class="panel table-wrap"><table class="data"><thead><tr><th><input id="select-all" type="checkbox" aria-label="전체 선택"></th><th>응답일</th><th>회사명</th><th>담당자</th><th>연락처</th><th>이메일</th><th>점수</th><th>레벨</th><th>변화</th><th>디지털</th><th>AI</th><th>조직</th></tr></thead><tbody id="rows"></tbody></table></section>
  <p class="privacy admin-note">운영 DB 연결 전에는 이 브라우저에 저장된 테스트 응답을 표시합니다. 원격 운영 환경에서는 config.js의 관리자 API와 인증 토큰을 연결하세요.</p>
</div></main>
<div id="delete-modal" class="delete-modal" hidden role="dialog" aria-modal="true" aria-labelledby="delete-title"><div class="panel delete-box"><h2 id="delete-title">선택한 응답을 삭제할까요?</h2><p id="delete-message"></p><p id="delete-error" class="delete-error" hidden></p><div class="admin-actions"><button id="delete-cancel" class="btn btn-secondary">취소</button><button id="delete-confirm" class="btn btn-primary">삭제하기</button></div></div></div>
<script src="config.js"></script><script src="admin.js"></script></body></html>

<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AX/DX 응답 관리자</title><link rel="stylesheet" href="styles.css"><style>.admin{padding:42px 0}.admin-head{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:24px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:22px 0}.stat{padding:22px}.stat strong{display:block;font-size:32px;color:var(--blue)}.table-wrap{overflow:auto}.data{width:100%;border-collapse:collapse;min-width:980px}.data th,.data td{text-align:left;padding:14px;border-bottom:1px solid var(--line);font-size:14px}.data th{background:var(--soft)}@media(max-width:700px){.admin-head{align-items:flex-start;flex-direction:column}.stats{grid-template-columns:1fr}}</style></head><body><main class="admin"><div class="wrap"><div class="admin-head"><div><a href="index.html">← 진단 화면</a><h1>진단 응답 관리자</h1><p>고객 정보와 진단 응답을 한 화면에서 확인합니다.</p></div><button id="csv" class="btn btn-primary">CSV 내보내기</button></div><div class="stats"><div class="panel stat"><span>전체 응답</span><strong id="count">0</strong></div><div class="panel stat"><span>평균 점수</span><strong id="avg">0</strong></div><div class="panel stat"><span>최근 응답</span><strong id="recent">-</strong></div></div><section class="panel table-wrap"><table class="data"><thead><tr><th>응답일</th><th>회사명</th><th>담당자</th><th>연락처</th><th>이메일</th><th>점수</th><th>레벨</th><th>변화</th><th>디지털</th><th>AI</th><th>조직</th></tr></thead><tbody id="rows"></tbody></table></section><p class="privacy">현재 설정이 비어 있으면 이 브라우저에 저장된 테스트 응답을 표시합니다. 운영 환경에서는 config.js의 관리자 API를 연결하고 인증·권한 정책을 적용하세요.</p></div></main><script src="config.js"></script><script src="admin.js"></script></body></html>
